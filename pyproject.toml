[project]
name = "jev-phishing-detector"
version = "0.1.0"
description = "Detector de phishing para Gmail e Microsoft 365/Outlook usando o modelo Jev (System One)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "msal>=1.28",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.scripts]
jev-phishing = "jev_phishing_detector.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_phishing_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
